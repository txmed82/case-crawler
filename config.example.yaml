ingestion:
  default_limit_per_source: 20
  sources:
    priority:
      - pubmed
      - glass
      - openfda
      - annas_archive
      - dailymed
      - rxnorm
      - medrxiv
      - clinicaltrials
      - firecrawl
    disabled: []

chunking:
  default_chunk_size: 500
  overlap: 50

embedding:
  model: "all-MiniLM-L6-v2"

storage:
  chroma_persist_dir: "./data/chroma"

synthetic:
  default_complexity: "moderate"
  default_modalities:
    - structured_ehr
    - clinical_text
    - labs
    - vitals
    - time_series
  validation_threshold: 0.8
  clinical_text_backend: "deterministic" # deterministic or llm
  imaging_backend: "placeholder"
  imaging_model_profile: null
  diffusers_model_id: "stabilityai/stable-diffusion-2-1"
  time_series_backend: "deterministic"
  time_series_model_profile: null
  time_series_command: null
  synthea_executable: null
  image_output_dir: "./data/images"
  export_formats:
    - sft_jsonl
    - chat_jsonl
    - tool_call_jsonl
    - multimodal_jsonl
    - dpo_jsonl
    - rl_jsonl

api:
  host: "0.0.0.0"
  port: 8000
