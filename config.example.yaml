ingestion:
  default_limit_per_source: 20
  sources:
    priority:
      - pubmed
      - glass
      - openfda
      - annas_archive
      - dailymed
      - rxnorm
      - medrxiv
      - clinicaltrials
      - firecrawl
    disabled: []

chunking:
  default_chunk_size: 500
  overlap: 50

embedding:
  model: "all-MiniLM-L6-v2"

storage:
  chroma_persist_dir: "./data/chroma"

synthetic:
  default_complexity: "moderate"
  default_modalities:
    - structured_ehr
    - clinical_text
    - labs
    - vitals
    - time_series
  validation_threshold: 0.8
  imaging_backend: "placeholder"
  synthea_executable: null
  image_output_dir: "./data/images"
  export_formats:
    - sft_jsonl
    - chat_jsonl
    - multimodal_jsonl

api:
  host: "0.0.0.0"
  port: 8000
