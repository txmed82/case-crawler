ingestion:
  default_limit_per_source: 20
  sources:
    priority:
      - pubmed
      - glass
      - openfda
      - annas_archive
      - dailymed
      - rxnorm
      - medrxiv
      - clinicaltrials
      - firecrawl
    disabled: []

chunking:
  default_chunk_size: 500
  overlap: 50

embedding:
  model: "all-MiniLM-L6-v2"

storage:
  chroma_persist_dir: "./data/chroma"

synthetic:
  default_complexity: "moderate"
  default_modalities:
    - structured_ehr
    - clinical_text
    - labs
    - vitals
    - time_series
  validation_threshold: 0.8
  # GenerationRequest can override clinical_text_backend, llm_provider,
  # llm_model, ollama_base_url, clinical_text_noise_profile,
  # clinical_text_model_profile, and clinical_text_command per run.
  clinical_text_backend: "deterministic" # deterministic, llm, or external
  clinical_text_noise_profile: "standard" # standard, message, ocr, or heavy
  clinical_text_model_profile: null # e.g. medgemma_4b_it or meditron_7b
  clinical_text_command: null # e.g. ["hf-note-sample", "--model", "local-notes"]
  # Per-request cohort_constraints can include:
  # age_min, age_max, sexes, sex_cycle, and base_time.
  # GenerationRequest can override imaging_backend, imaging_model_profile,
  # diffusers_model_id, and imaging_command for a single dataset generation run.
  imaging_backend: "placeholder" # placeholder, diffusers, or external
  imaging_model_profile: null # e.g. cxr_pneumonia_dreambooth
  diffusers_model_id: "stabilityai/stable-diffusion-2-1"
  imaging_command: null # e.g. ["hf-image-sample", "--model", "local-cxr"]
  # External imaging commands receive stdin JSON with output_dir, prompt,
  # modality, and body_region. They must print an ImagingAsset JSON object
  # or {"asset": ImagingAsset} to stdout.
  # GenerationRequest can override time_series_backend,
  # time_series_model_profile, and time_series_command per run.
  time_series_backend: "deterministic" # deterministic or external
  time_series_model_profile: null # e.g. timediff or rawmed
  time_series_command: null # e.g. ["timediff-sample", "--checkpoint", "local.pt"]
  # External time-series commands may print TimeSeriesChannel[] or
  # {"channels": [TimeSeriesChannel, ...]} to stdout.
  synthea_executable: null
  image_output_dir: "./data/images"
  export_formats:
    - raw_jsonl
    - sft_jsonl
    - note_fact_sft_jsonl
    - clinical_observation_jsonl
    - medication_reconciliation_jsonl
    - chat_jsonl
    - tool_call_jsonl
    - multimodal_jsonl
    - time_series_jsonl
    - dpo_jsonl
    - rl_jsonl
    - fhir_ndjson
    - parquet

api:
  host: "0.0.0.0"
  port: 8000
