name: optional-backends

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install optional backend extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,anthropic,openai,hf,parquet]"

      - name: Run optional backend pytest tier
        run: pytest -q -m "optional_backend or slow"
