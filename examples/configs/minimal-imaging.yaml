# Minimal imaging-enabled configuration.
#
# Use case: chest-radiograph synthetic records with file-backed image
# assets generated by a Hugging Face diffusers model.
#
# Prerequisites:
#   - pip install -e ".[hf,imaging]"
#   - HF_TOKEN in .env (required for gated models like MediSyn; not
#     required for CheXGenBench Sana).
#
# Pick a different model with `casecrawler suggest-imaging-models
# --modality chest_xray --limit 10` and pin it under
# `synthetic.diffusers_model_id`.

ingestion:
  default_limit_per_source: 20

storage:
  chroma_persist_dir: ./data/chroma

llm:
  provider: anthropic        # only used if clinical_text_backend=llm
  model: claude-sonnet-4-6

synthetic:
  default_modalities:
    - structured_ehr
    - clinical_text
    - labs
    - vitals
    - imaging
  clinical_text_backend: deterministic
  imaging_backend: diffusers
  diffusers_model_id: raman07/CheXGenBench-Models-Sana-e20
  imaging_model_profile: cxr_sana_chexgenbench
  # For MediSyn (gated) instead, after accepting the license on HF:
  # diffusers_model_id: hiesingerlab/MediSyn
  # imaging_model_profile: medisyn
  export_formats:
    - raw_jsonl
    - multimodal_jsonl

api:
  host: 0.0.0.0
  port: 8000
